[project]
name = "subradar"
version = "0.1.0"
description = "Personal weekend event radar for Upper Austria and Vienna, with a swipe app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "icalendar>=5.0",
  "python-dateutil>=2.9",
  "anthropic>=0.40",
]

[project.scripts]
subradar = "subradar.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
